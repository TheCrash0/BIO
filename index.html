<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TheCrash – Link Hub</title>
  <meta name="description" content="All my socials in one place – TikTok, Twitch, YouTube, Discord and more." />
  <meta property="og:title" content="TheCrash – Link Hub" />
  <meta property="og:description" content="All my socials in one place – TikTok, Twitch, YouTube, Discord and more." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-start:#0b0b12;
      --bg-mid:#141428;
      --bg-end:#1b0f2f;
      --brand:#8b5cf6;
      --brand-2:#a78bfa;
      --text:#e6e6f0;
      --muted:#b8b8cc;
      --card:#0f1020cc;
      --stroke:#ffffff1a;
      --tiktok:#000000;
      --yt:#ff0033;
      --twitch:#6441a5;
      --x:#111111;
      --discord:#5865f2;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 600px at 10% 10%, #21114a 0%, transparent 60%),
                  radial-gradient(1000px 500px at 90% 20%, #1d2d50 0%, transparent 60%),
                  linear-gradient(160deg,var(--bg-start),var(--bg-mid) 50%,var(--bg-end));
      overflow-x:hidden;
    }
    .container{min-height:100%; display:grid; place-items:center; padding:24px}
    .card{
      width:min(680px, 92vw);
      background:rgba(15,16,32,0.65);
      border:1px solid var(--stroke);
      border-radius:28px; backdrop-filter: blur(12px);
      padding:28px; position:relative; box-shadow:0 20px 60px #0005;
      overflow:hidden;
    }
    .glow{position:absolute; inset:auto -40% -40% auto; width:520px; height:520px; background:radial-gradient(closest-side, #8b5cf688, transparent 60%); filter:blur(40px); pointer-events:none}
    header{display:flex; gap:18px; align-items:center;}
    .avatar{width:88px; height:88px; border-radius:50%; border:2px solid var(--stroke); overflow:hidden; flex:0 0 auto}
    .avatar img{width:100%; height:100%; object-fit:cover}
    .titlewrap{flex:1 1 auto}
    h1{margin:0; font-size:28px; letter-spacing:0.2px}
    .tag{display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; border:1px solid var(--stroke); color:var(--muted); font-size:13px}
    .live{display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:linear-gradient(90deg,#22c55e22,#22c55e14); border:1px solid #22c55e33; color:#a7f3d0; font-size:12px}
    .grid{margin-top:22px; display:grid; gap:12px}
    .cta{display:block; text-decoration:none;}
    .btn{
      width:100%; display:flex; align-items:center; justify-content:space-between; gap:16px;
      border:1px solid var(--stroke); background:#0b0c1acc; padding:16px 18px; border-radius:16px; transition:transform .08s ease, box-shadow .2s ease, border-color .2s ease; text-decoration:none; color:var(--text);
    }
    .btn:hover{transform:translateY(-1px); box-shadow:0 8px 24px #0006; border-color:#ffffff33}
    .left{display:flex; align-items:center; gap:14px}
    .icon{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; font-weight:800}
    .txt{display:flex; flex-direction:column}
    .label{font-weight:700; font-size:16px}
    .sub{font-size:13px; color:var(--muted)}
    .badge{font-size:12px; padding:4px 8px; border-radius:999px; border:1px solid var(--stroke); color:var(--muted)}
    .tiktok .icon{background:linear-gradient(135deg,#25F4EE,#FE2C55)}
    .yt .icon{background:var(--yt)}
    .twitch .icon{background:var(--twitch)}
    .x .icon{background:var(--x)}
    .discord .icon{background:var(--discord)}
    .links-row{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
    @media (max-width:560px){.links-row{grid-template-columns:1fr}}
    .footer{margin-top:18px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
    .small{font-size:12px; color:var(--muted)}
    .pill{padding:8px 12px; border:1px solid var(--stroke); border-radius:999px; background:#0b0c1acc; cursor:pointer}
    .pill:active{transform:scale(.98)}
    .brandline{height:1px; background:linear-gradient(90deg,transparent, #a78bfa55, transparent); margin:14px 0}
    .hero{
      margin:18px 0 6px; padding:14px; border-radius:18px; border:1px dashed #ffffff26; background:linear-gradient(180deg,#ffffff06,#ffffff03);
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="card">
      <div class="glow" aria-hidden="true"></div>
      <header>
        <div class="avatar">
          <img src="https://i.imgur.com/lggRXuk.png" alt="Avatar" />
        </div>
        <div class="titlewrap">
          <h1>TheCrash</h1>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px">
            <span class="tag">VTuber • Gaming • Reviews</span>
            <span class="live" id="live-pill" style="display:none"><span style="width:8px;height:8px;background:#22c55e;border-radius:999px"></span> LIVE on Twitch</span>
          </div>
        </div>
        <button id="share" class="pill" title="Seite teilen">Teilen</button>
      </header>

      <div class="hero">
        <div style="display:flex; gap:10px; align-items:center; justify-content:space-between;">
          <div style="display:flex; gap:10px; align-items:center;">
            <div class="icon" style="background:linear-gradient(135deg,#25F4EE,#FE2C55); color:#fff">TT</div>
            <div class="txt">
              <div class="label">Follow on TikTok</div>
              <div class="sub">@thecrash__3</div>
            </div>
          </div>
          <a class="pill" href="https://www.tiktok.com/@thecrash__3" target="_blank" rel="noopener">Öffnen</a>
        </div>
      </div>

      <div class="grid">
        <a class="cta btn tiktok" href="https://www.tiktok.com/@thecrash__3" target="_blank" rel="noopener">
          <div class="left">
            <div class="icon">♪</div>
            <div class="txt">
              <span class="label">TikTok</span>
              <span class="sub">Clips • Edits • Highlights</span>
            </div>
          </div>
          <span class="badge">Top</span>
        </a>

        <div class="links-row">
          <a class="cta btn twitch" href="https://www.twitch.tv/0thecrash0" target="_blank" rel="noopener">
            <div class="left">
              <div class="icon">☁</div>
              <div class="txt">
                <span class="label">Twitch</span>
                <span class="sub">Livestreams & Chat</span>
              </div>
            </div>
            <span class="badge">Live-Check</span>
          </a>

          <a class="cta btn yt" href="https://www.youtube.com/@0TheCrash0" target="_blank" rel="noopener">
            <div class="left">
              <div class="icon">▶</div>
              <div class="txt">
                <span class="label">YouTube</span>
                <span class="sub">Longform & VODs</span>
              </div>
            </div>
            <span class="badge">Neu</span>
          </a>
        </div>

        <div class="links-row">
          <a class="cta btn x" href="https://x.com/TheCrash00" target="_blank" rel="noopener">
            <div class="left">
              <div class="icon">X</div>
              <div class="txt">
                <span class="label">X / Twitter</span>
                <span class="sub">Updates & Meinungen</span>
              </div>
            </div>
            <span class="badge">Post</span>
          </a>

          <button class="cta btn discord" id="copy-discord" style="cursor:pointer">
            <div class="left">
              <div class="icon">💬</div>
              <div class="txt">
                <span class="label">Discord</span>
                <span class="sub">729009381315969044</span>
              </div>
            </div>
            <span class="badge">Kopieren</span>
          </button>
        </div>

        <div class="brandline"></div>
      </div>

      <div class="footer">
        <button class="pill small" id="copy">Link kopieren</button>
        <span class="small" style="opacity:.8">© <span id="year"></span> TheCrash</span>
      </div>
    </main>
  </div>

  <script>
    const shareBtn = document.getElementById('share');
    shareBtn?.addEventListener('click', async () => {
      try{
        if(navigator.share){
          await navigator.share({title: document.title, text: 'Check my links', url: location.href});
        } else {
          await navigator.clipboard.writeText(location.href);
          shareBtn.textContent = 'Kopiert!';
          setTimeout(()=> shareBtn.textContent='Teilen', 1200);
        }
      }catch(e){}
    });

    const copyBtn = document.getElementById('copy');
    copyBtn?.addEventListener('click', async ()=>{
      await navigator.clipboard.writeText(location.href);
      copyBtn.textContent = 'Kopiert!';
      setTimeout(()=> copyBtn.textContent='Link kopieren', 1200);
    });

    const copyDiscord = document.getElementById('copy-discord');
    copyDiscord?.addEventListener('click', async ()=>{
      await navigator.clipboard.writeText('729009381315969044');
      copyDiscord.querySelector('.badge').textContent = 'Kopiert!';
      setTimeout(()=> copyDiscord.querySelector('.badge').textContent = 'Kopieren', 1200);
    });

    const hours = new Date().getHours();
    if(hours >= 18 || hours < 2){
      document.getElementById('live-pill').style.display = 'inline-flex';
    }

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
